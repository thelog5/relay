# Relay: everything runs locally with one `docker compose up` (R10).
#
#   dashboard   http://localhost:8080
#   prometheus  http://localhost:9090
#   grafana     http://localhost:3000  (anonymous viewer, admin/admin to edit)

name: relay

x-relay-env: &relay-env
  DATABASE_URL: postgres://relay:relay@postgres:5432/relay?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF with fsync every second: a Redis crash loses at most ~1s of queue
    # operations instead of everything since the last snapshot.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: .
    image: relay:local
    command: ["api"]
    environment:
      <<: *relay-env
      HTTP_ADDR: :8080
      KILL_TOKEN: ${KILL_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Three worker containers. A killed worker exits with status 1 and Docker
  # restarts it, so it comes back on its own under a new consumer name while
  # the survivors finish its jobs.
  worker:
    image: relay:local
    command: ["worker"]
    environment:
      <<: *relay-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
      METRICS_ADDR: :9091
    deploy:
      replicas: 3
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/relay.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
