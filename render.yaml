# Render Blueprint for the public Relay demo. In the Render dashboard choose
# New > Blueprint, connect this repo, and apply. About $13 a month:
#
#   relayqueue  web service, Starter ($7): the api plus 3 supervised worker
#               processes (cmd/allinone), so the dashboard's kill button still
#               kills a real process and a replacement starts a second later.
#               Paid instances never sleep.
#   relay-kv    Key Value (Valkey 8, Redis-compatible), free: in-memory only,
#               and the reconciler re-queues unfinished jobs from Postgres if
#               it restarts. Finished jobs are deleted from the stream, so the
#               25 MB limit holds well past the demo's 20,000-job queue cap.
#   relay-db    Postgres 16, Basic-256mb ($6): no 30-day expiry, point-in-time
#               recovery
#
# Details, custom domain and upgrades: infra/render/README.md
services:
  - type: web
    name: relayqueue
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: allinone
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: relay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: relay-kv
          property: connectionString
      # Public-demo protections: rate limits, queue cap, webhook jobs off,
      # sleep capped at 10s, finished jobs purged after 6 hours.
      - key: DEMO_MODE
        value: "true"
      # Render's proxy appends the visitor's address to X-Forwarded-For.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: WORKERS
        value: "3"
      - key: WORKER_CONCURRENCY
        value: "4"
      # Small pools: four processes share one database and one Key Value
      # instance (Basic-256mb allows 100 connections; free Key Value 50).
      - key: PG_MAX_CONNS
        value: "8"
      - key: REDIS_POOL_SIZE
        value: "12"
      - key: WORKER_REDIS_POOL_SIZE
        value: "8"

  - type: keyvalue
    name: relay-kv
    plan: free
    # Streams must never be evicted: the default allkeys-lru would silently
    # drop queued jobs under memory pressure.
    maxmemoryPolicy: noeviction
    # Empty list: reachable only from services in this Render account.
    ipAllowList: []

databases:
  - name: relay-db
    plan: basic-256mb
    databaseName: relay
    user: relay
    postgresMajorVersion: "16"
