# Render Blueprint for the public Relay demo, with Postgres on Neon's free
# plan. In the Render dashboard choose New > Blueprint, connect this repo,
# paste the Neon connection string when asked for DATABASE_URL, and apply.
# About $7 a month:
#
#   relayqueue  web service, Starter ($7): the api plus 3 supervised worker
#               processes (cmd/allinone), so the dashboard's kill button still
#               kills a real process and a replacement starts a second later.
#               Paid instances never sleep.
#   relay-kv    Key Value (Valkey 8, Redis-compatible), free: in-memory only,
#               and the reconciler re-queues unfinished jobs from Postgres if
#               it restarts. Finished jobs are deleted from the stream, so the
#               25 MB limit holds well past the demo's 20,000-job queue cap.
#   Postgres    Neon, free (not created by this file). IDLE_AFTER stops the
#               api querying it when nothing is happening, so Neon can scale
#               to zero and the free 100 compute-hours a month last.
#
# Neon setup, custom domain and upgrades: infra/render/README.md
services:
  - type: web
    name: relayqueue
    runtime: docker
    plan: starter
    # Same region as the Neon project (AWS US West 2, Oregon): every job
    # makes four Postgres writes, so the round trip matters.
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: allinone
    healthCheckPath: /healthz
    envVars:
      # Neon's direct connection string (pooling off), from the Neon console.
      # Render asks for it when the Blueprint is first applied; it is never
      # stored in this repo.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: relay-kv
          property: connectionString
      # Stop querying Postgres after 2 quiet minutes so Neon can sleep; the
      # next visitor or job wakes it in well under a second.
      - key: IDLE_AFTER
        value: "2m"
      # Public-demo protections: rate limits, queue cap, webhook jobs off,
      # sleep capped at 10s, finished jobs purged after 6 hours.
      - key: DEMO_MODE
        value: "true"
      # Render's proxy appends the visitor's address to X-Forwarded-For.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: WORKERS
        value: "3"
      - key: WORKER_CONCURRENCY
        value: "4"
      # Small pools: four processes share one database and one Key Value
      # instance (free Key Value allows 50 connections).
      - key: PG_MAX_CONNS
        value: "8"
      - key: REDIS_POOL_SIZE
        value: "12"
      - key: WORKER_REDIS_POOL_SIZE
        value: "8"

  - type: keyvalue
    name: relay-kv
    plan: free
    region: oregon
    # Streams must never be evicted: the default allkeys-lru would silently
    # drop queued jobs under memory pressure.
    maxmemoryPolicy: noeviction
    # Empty list: reachable only from services in this Render account.
    ipAllowList: []
